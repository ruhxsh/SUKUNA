name: SUKUNA Administration & Security Checks

on:
  push:
    branches: [rebuild/sukuna-admin]
    paths:
      - "bots/sukuna-admin/**"
      - ".github/workflows/sukuna-admin-checks.yml"
  pull_request:
    paths:
      - "bots/sukuna-admin/**"
      - ".github/workflows/sukuna-admin-checks.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots/sukuna-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bots/sukuna-admin/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
